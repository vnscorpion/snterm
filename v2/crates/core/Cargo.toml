[package]
name = "snterm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SN Term core: storage, crypto, SSH/SFTP (UI-agnostic)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
zeroize.workspace = true

# SSH / SFTP
russh = "0.63"
russh-sftp = "3"
ssh-key = { version = "0.7.0-rc.11", features = ["ppk", "ed25519", "rsa", "ecdsa", "encryption", "std"] }
async-trait = "0.1"

# .snterm file crypto (AES-256-GCM + PBKDF2-SHA256)
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"


# Edit-in-editor file watching
notify = "8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
